[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camtraj"
version = "0.1.0"
description = "User-friendly camera trajectory authoring, randomization, visualization, and export."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
viz = ["matplotlib", "viser"]
io = ["pyyaml"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
